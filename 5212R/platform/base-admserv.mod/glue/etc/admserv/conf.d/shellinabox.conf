# Shellinabox is localhost-only. AdmServ is the sole public entry point.
ProxyRequests Off

# The helper is a persistent RewriteMap program. It receives the opaque
# bxshell_auth cookie value and returns "valid" or "invalid".
RewriteEngine On
RewriteMap shellinabox_auth prg:/usr/sausalito/handlers/base/remote/shell_token_check.pl

# Default deny: authorize the complete /bxshell namespace.
RewriteCond %{HTTP:Cookie} (^|;[[:space:]]*)bxshell_auth=([0-9a-f]{64})(;|$)
RewriteCond ${shellinabox_auth:%2:%{REMOTE_ADDR}|invalid} =valid
RewriteRule ^/bxshell(?:/|$) - [E=SHELLINABOX_AUTH:1]

RewriteCond %{REQUEST_URI} ^/bxshell(?:/|$)
RewriteCond %{ENV:SHELLINABOX_AUTH} !=1
RewriteRule ^ - [F,L]

<Proxy *>
	ProxyPreserveHost On
    AddDefaultCharset off
</Proxy>

<Location /bxshell>
    ProxyPass http://127.0.0.1:4200/ max=5 ttl=300
    ProxyPassReverse http://127.0.0.1:4200/
</Location>

Redirect permanent /bxshell https://%{HTTP_HOST}:81/bxshell
