#
### Proxy to map /v2/cce to https://127.0.0.1:9092/v2/cce for access to CCEd-API:
#

SSLProxyEngine On
SSLProxyCheckPeerCN off
SSLProxyCheckPeerName off
SSLProxyVerify none
SSLProxyVerifyDepth 1

# Never forward client-spoofable IP headers. Set X-Real-IP from the TCP peer
# that connected to AdmServ (real client). cced-api trusts this header only
# when the peer to :9092 is loopback (see extractClientIP / isLoopbackPeer).
RequestHeader unset X-Real-IP early
RequestHeader unset X-Forwarded-For early
RequestHeader unset X-Forwarded-Proto early
RequestHeader unset X-Forwarded-Host early
RequestHeader unset X-Client-IP early
RequestHeader unset True-Client-IP early
RequestHeader unset Forwarded early
RequestHeader unset Cluster-Client-IP early
RequestHeader set X-Real-IP %{REMOTE_ADDR}s

ProxyPreserveHost On
ProxyPass /v2/cce https://127.0.0.1:9092/v2/cce
ProxyPassReverse /v2/cce https://127.0.0.1:9092/v2/cce

ProxyPass /v2/metrics https://127.0.0.1:9092/v2/metrics
ProxyPassReverse /v2/metrics https://127.0.0.1:9092/v2/metrics

ProxyPass /v2/services https://127.0.0.1:9092/v2/services
ProxyPassReverse /v2/services https://127.0.0.1:9092/v2/services

