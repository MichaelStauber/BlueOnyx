#
# GoAccess real-time HTML is localhost-only. AdmServ is the sole public
# entry point. Access requires the BXGoAccess cookie set by authenticated
# GUI controllers (adminUser sitestats pages) - same pattern as Monitorix.
#
# Browser:  wss://GUI-host:GUI-port/goaccess-ws/
# Backend:  ws://127.0.0.1:7890/  (goaccess_init.sh, no public bind, no TLS)
#

# Non-empty BXGoAccess cookie (value = CCE sessionId after GUI login)
SetEnvIf Cookie "(^|;\s*)BXGoAccess=([^;]+)" BX_GOACCESS_OK=1

ProxyRequests Off

# Allow reverse-proxy to the loopback GoAccess WebSocket (otherwise
# authz_core AH01630: client denied by server configuration: proxy:ws://...)
<Proxy "ws://127.0.0.1:7890/">
	Require all granted
</Proxy>
<Proxy "http://127.0.0.1:7890/">
	Require all granted
</Proxy>

# Location wins over DocumentRoot .htaccess CI front-controller rewrite.
# Front door still requires BXGoAccess from authenticated GUI.
<Location /goaccess-ws/>
	Require env BX_GOACCESS_OK
	ProxyPass        ws://127.0.0.1:7890/
	ProxyPassReverse ws://127.0.0.1:7890/
</Location>
