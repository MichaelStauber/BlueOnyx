# BlueOnyx: an empty jk_socketd.ini means "nothing to broker", not "broken".
#
# base-shell.mod's update_jk_socketd_ini() rebuilds /etc/jailkit/jk_socketd.ini from
# scratch out of the socket paths of *jailed* Vsites and then restarts this unit. With
# no jailed Vsite yet it writes zero bytes, and jk_socketd then exits 1 with
# "no valid sockets specified ... nothing to do". The jailkit RPM ships the unit
# enabled, so systemd starts it on a virgin first boot before any handler can run and
# the unit is left failed -- which marks the whole system degraded.
#
# ConditionFileNotEmpty turns that start into a skip instead of a failure. Enablement
# is untouched: the unit stays enabled and starts normally as soon as a jailed Vsite
# gives it work to do. jailkit_enabler.pl remains the only owner of the on/off policy.
[Unit]
ConditionFileNotEmpty=/etc/jailkit/jk_socketd.ini
