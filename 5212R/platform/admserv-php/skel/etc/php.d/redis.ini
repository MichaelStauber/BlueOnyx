; Enable Redis extension (Valkey/Redis available to AdmServ PHP)
extension=redis.so

; AdmServ PHP sessions use files under /usr/sausalito/sessions/php (admserv:admserv).
; Do not override session.save_handler here - that path is owned by admserv and
; cleaned by tmpwatch (see skel/etc/cron.daily/tmpwatch-admserv-php-sessions).
; App code may still use Redis/Valkey explicitly.

redis.pconnect.pooling_enabled = 1
redis.pconnect.connection_limit = 0
redis.serializer = php
redis.tcp_keepalive = 1
redis.timeout = 2.5
redis.read_timeout = 2.5
