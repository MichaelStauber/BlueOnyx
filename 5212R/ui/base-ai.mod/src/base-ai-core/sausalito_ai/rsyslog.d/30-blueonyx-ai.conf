# BlueOnyx AI audit log routing.
#
# Route only the BlueOnyx AI syslog tag from local6 into a dedicated file.
# This keeps audit events out of /var/log/messages while leaving other local6
# senders untouched.

if ($syslogfacility-text == "local6" and $programname == "blueonyx-ai") then {
    action(type="omfile" file="/var/log/blueonyx-ai.log")
    stop
}
