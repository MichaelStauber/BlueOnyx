# Global Error Pages Configuration in case Vsite is missing /wwwroot/web/error/:

# Check if the VirtualSite's error page exists, otherwise fall back to the global error directory
ErrorDocument 401 /fallback-error/401-authorization.html
ErrorDocument 403 /fallback-error/403-forbidden.html
ErrorDocument 404 /fallback-error/404-file-not-found.html
ErrorDocument 500 /fallback-error/500-internal-server-error.html
ErrorDocument 502 /fallback-error/502-bad-gateway.html

# Alias for fallback error pages
Alias /fallback-error/ "/var/www/html/error/"

<Directory "/var/www/html/error">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Disable directory listing for /usr/share/httpd/icons/:
<Directory /usr/share/httpd/icons/>
Options -Indexes
</Directory> 

# Turn off Apache debugging support for TRACK/TRACE:
TraceEnable off

# Don't let the whole world know which modules we're running:
ServerTokens ProductOnly

# Ensure mod_remoteip is available (distro usually loads it from
# conf.modules.d/00-base.conf; this guards odd/minimal installs).
<IfModule !remoteip_module>
    LoadModule remoteip_module modules/mod_remoteip.so
</IfModule>

# ---------------------------------------------------------------------------
# Client IP for access_log / fail2ban (Greg Kuhnert 2026-11-06)
#
# NEVER log %{X-Real-IP}i from arbitrary clients. Attackers rotate spoofed
# X-Real-IP per request and break fail2ban (or frame third parties).
#
# mod_remoteip: trust forward headers ONLY from local/known reverse proxies
# (nginx on this box). %a is the client IP after RemoteIP processing.
# Vsite-level RemoteIPInternalProxy lines are also emitted by virtual_host.pl
# when Nginx is enabled (server IP as nginx->httpd peer).
# ---------------------------------------------------------------------------
RemoteIPHeader X-Real-IP
RemoteIPInternalProxy 127.0.0.1
RemoteIPInternalProxy ::1

LogFormat "%v %a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "/var/log/httpd/access_log" combined

# For Vsite error pages in Elmer Style:
Alias /.elm /usr/sausalito/ui/web/.elm
<Directory "/usr/sausalito/ui/web/.elm">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
