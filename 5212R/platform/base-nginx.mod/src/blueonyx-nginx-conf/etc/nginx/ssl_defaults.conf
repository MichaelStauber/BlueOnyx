#
# Do NOT edit this file. The GUI will replace this file on edits.
# Custom edits need to go into separate config files in one of
# the separate include directories under /etc/nginx/
#

    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:30m;
    ssl_session_tickets off;

    resolver 8.8.8.8  valid=300s;
    resolver_timeout 30s;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify off;

    ssl_dhparam /usr/share/ssl/certs/sendmail-2048.dh;

