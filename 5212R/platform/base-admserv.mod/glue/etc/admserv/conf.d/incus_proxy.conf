# ----------------- Modules & base SSL proxying -----------------
LoadModule proxy_module           modules/mod_proxy.so
LoadModule proxy_wstunnel_module  modules/mod_proxy_wstunnel.so
LoadModule ssl_module             modules/mod_ssl.so

# We proxy to a local Incus with a client cert; the actual cert path
# lives in the optional include so AdmServ w/o the Incus PKG still starts.
SSLProxyEngine on
SSLProxyCheckPeerCN      off
SSLProxyCheckPeerName    off
SSLProxyCheckPeerExpire  off
IncludeOptional /etc/admserv/conf.d/incus_proxy-extra.conf

# Strip proxy headers we don't want to forward
ProxyAddHeaders Off
RequestHeader unset X-Forwarded-For   early
RequestHeader unset X-Forwarded-Host  early
RequestHeader unset X-Forwarded-Proto early

# ----------------- Rewrites, normalizers, and env flags -----------------
RewriteEngine On

# Normalize missing trailing slashes so paths don't get chopped
RewriteRule ^/incus_api$                 /incus_api/                 [R=301,L]
RewriteRule ^/incus_console/operations$  /incus_console/operations/  [R=301,L]

# Same-origin flags (no hard-coded host). These set ORIGIN_OK/REFERER_OK when
# the browser request comes from the current Host: and ServerPort.
RewriteCond %{HTTP_ORIGIN}  ^https?://%{HTTP_HOST}(:%{SERVER_PORT})?$
RewriteRule ^ - [E=ORIGIN_OK:1]
RewriteCond %{HTTP_REFERER} ^https?://%{HTTP_HOST}(:%{SERVER_PORT})?/
RewriteRule ^ - [E=REFERER_OK:1]

# Fast-fail gates (before proxying) for missing session cookie
RewriteCond %{HTTP_COOKIE} !(^|;\s*)sessionId=[^;]+ [NC]
RewriteRule ^/incus_console/operations/.*$ /remote/noaccess [R,L]

RewriteCond %{HTTP_COOKIE} !(^|;\s*)sessionId=[^;]+ [NC]
RewriteRule ^/spice/.*$                  /remote/noaccess [R,L]
RewriteCond %{HTTP_COOKIE} !(^|;\s*)sessionId=[^;]+ [NC]
RewriteRule ^/spice_proxy/.*$            /remote/noaccess [R,L]

# ----------------- Proxies -----------------

# WebSocket console to Incus operations (proxied only after gates above)
ProxyPass        "/incus_console/operations/"  "wss://127.0.0.1:8443/1.0/operations/"
ProxyPassReverse "/incus_console/operations/"  "wss://127.0.0.1:8443/1.0/operations/"

# REST API via Apache, but only usable from loopback
ProxyPass        /incus_api/  https://127.0.0.1:8443/
ProxyPassReverse /incus_api/  https://127.0.0.1:8443/

<Location "/incus_api/">
  Require ip 127.0.0.1 ::1
  <LimitExcept GET POST PUT PATCH DELETE OPTIONS>
    Require all denied
  </LimitExcept>
</Location>

# Extra defense-in-depth for the console WS: same-origin AND session cookie
<Location "/incus_console/operations/">
  <RequireAny>
    Require env ORIGIN_OK
    Require env REFERER_OK
  </RequireAny>
  Require expr %{HTTP_COOKIE} =~ /(^|;\s*)sessionId=[^;]+/
</Location>

# ----------------- SPICE client & proxy -----------------

Alias /spice /usr/share/spice-html5
<Directory /usr/share/spice-html5>
  Allow from all
  Satisfy Any
  DirectoryIndex spice.html
</Directory>

# Dynamic ws proxy to the per-VM websockify port (?port=NNNN in query)
RewriteCond %{QUERY_STRING} port=(.*)
RewriteRule ^/spice_proxy/(.*)$ ws://127.0.0.1:%1/$1 [P]

# Fallback (optional) if no port= is supplied
ProxyPass        /spice_proxy/  ws://127.0.0.1:5901/
ProxyPassReverse /spice_proxy/  ws://127.0.0.1:5901/

# Enforce same-origin AND session cookie on both /spice and /spice_proxy
<LocationMatch "^/(spice|spice_proxy)/">
  <RequireAny>
    Require env ORIGIN_OK
    Require env REFERER_OK
  </RequireAny>
  Require expr %{HTTP_COOKIE} =~ /(^|;\s*)sessionId=[^;]+/
</LocationMatch>

