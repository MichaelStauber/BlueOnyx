# HTTP → HTTPS bounce for AdmServ (port 81).
# Prefer Apache over CodeIgniter forceGlobalSecureRequests so the Location
# keeps the client Host (IP or name + :81) and never injects index.php.
# Skip ErrorDocument/subrequests (else Host can be empty and path becomes
# /gui/AuthorizationRequired401). Credit: Greg Kuhnert (bot catch, 2026-11).
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteCond %{ENV:REDIRECT_STATUS} ^$
    RewriteCond %{HTTP_HOST} ^(.+)$
    RewriteRule ^ https://%1%{REQUEST_URI} [R=301,L]
</IfModule>
