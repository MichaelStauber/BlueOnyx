# phpMyAdmin - Web based MySQL browser (BlueOnyx packaged)

Redirect 301 /phpMyAdmin /base/phpMyAdmin/index.php

<Directory /usr/sausalito/ui/web/base/phpMyAdmin>
    CGIPassAuth on
    DirectoryIndex index.php
    Require all granted
</Directory>

# Libraries must not be reachable over HTTP
<Directory /usr/sausalito/ui/web/base/phpMyAdmin/libraries>
    Require all denied
</Directory>

<Directory /usr/sausalito/ui/web/base/phpMyAdmin/templates>
    Require all denied
</Directory>

<Directory /usr/sausalito/ui/web/base/phpMyAdmin/setup>
    Require all denied
</Directory>
