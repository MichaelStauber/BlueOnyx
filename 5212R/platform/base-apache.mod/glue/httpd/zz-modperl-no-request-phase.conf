#
# Disable mod_perl request-phase handlers on the public httpd.
#
# BlueOnyx loads mod_perl only so PerlConfigRequire can build default
# VirtualHosts at startup (conf.perl/00-default-vsite.pl). Nothing in the
# public server uses Perl handlers at request time.
#
# With MPM event and HTTP/2, mod_perl still registers a per-request cleanup
# that can segfault in threaded workers (modperl_config_request_cleanup).
# PerlOptions -Enable turns that off while leaving PerlConfigRequire working.
#
# AdmServ (port 444) does not include this directory and is not affected.
#
PerlOptions -Enable
