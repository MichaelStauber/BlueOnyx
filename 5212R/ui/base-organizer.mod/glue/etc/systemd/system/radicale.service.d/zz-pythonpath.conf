# radicale3 (EL8/EL9 BlueOnyx packaging) ships runtime deps
# (vobject, and on some builds passlib/defusedxml) under
# /usr/lib/radicale/.local/lib/pythonX.Y/site-packages/ while ExecStart
# uses system python without that path → ModuleNotFoundError / DistributionNotFound
# for vobject. PYTHONPATH exposes the bundled site-packages.
# Multiple pythonX.Y dirs listed; missing paths are ignored by the interpreter.
# EL10+ with system python3-vobject: drop-in is harmless if .local empty/unused.
[Service]
Environment=PYTHONPATH=/usr/lib/radicale/.local/lib/python3.8/site-packages:/usr/lib/radicale/.local/lib/python3.9/site-packages:/usr/lib/radicale/.local/lib/python3.12/site-packages

